# The whole app in one command, for demos, from a fresh clone of this repository: PostgreSQL with real incident
# data, the scorer, this gateway and the web app. Nothing here touches Azure or PagerDuty, and nothing else needs
# cloning: the scorer and the web app are built straight from their GitHub repositories. No .env either: the
# database passwords, the JWT signing secret and the scorer's API key are random values generated on first start
# (secrets.sh) and kept in the secrets volume. Only the demo sign-ins below are fixed.
#
#   docker compose -f demo/compose.yaml up --build     first run builds the images (several minutes)
#   open http://localhost:8088
#
#   Sign in as                     password
#   admin@example.com              Demo-Admin-2026      everything, users, syncs, audit log
#   manager@example.com            Demo-Manager-2026    teams Volvo G92 and Volvo G230 2nd (India)
#   engineer@example.com           Demo-Engineer-2026   an engineer in Volvo G92: their own figures
#
#   docker compose -f demo/compose.yaml down           stop (the data stays)
#   docker compose -f demo/compose.yaml down -v        stop and forget the data and the secrets; the next start
#                                                      generates new ones and seeds afresh
#
# The data: on first start the seed job downloads two published incident logs (Volvo IT, BPI Challenge 2013, from
# 4TU.ResearchData; a ServiceNow instance, from the UCI repository) and loads 21 teams, ~500 engineers and
# ~19,000 alerts, with the dates moved so the latest incidents are from the past week. It needs internet access
# then; the sign-ins exist once it has finished. Sources and licences: demo/import_real_data.py.
#
# Settings (environment variables or a demo/.env file):
#   WEB_PORT=8088                          the port the app is published on
#   SCORER_CONTEXT, WEB_CONTEXT            build the scorer or web app from a local checkout instead of GitHub,
#                                          relative to this folder, e.g. WEB_CONTEXT=../../fairness-web
#
# API docs: http://localhost:8088/swagger-ui.html.
# Database: docker compose -f demo/compose.yaml exec db psql -U fairness fairness
name: fairness-demo

x-demo:
  timezone: &timezone Asia/Kolkata
  # The generated passwords and keys, one file each, read-only
  secrets-volume: &secrets-volume secrets:/run/secrets:ro

services:
  # One-off: generates the passwords and keys on first start, keeps them afterwards, then exits
  secrets:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/secrets.sh"]
    volumes:
      - secrets:/run/secrets
      - ./secrets.sh:/secrets.sh:ro
    restart: "no"

  db:
    image: postgres:17-alpine
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: fairness
      POSTGRES_USER: fairness
      POSTGRES_PASSWORD_FILE: /run/secrets/AZURE_DB_PASSWORD
    volumes:
      - db-data:/var/lib/postgresql/data
      - *secrets-volume
      # Creates the scorer's read-only login on first start
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-scorer-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairness -d fairness"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build: ..
    image: fairness-demo/gateway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - *secrets-volume
    environment:
      # AZURE_DB_PASSWORD, JWT_SECRET and SCORER_API_KEY: each file in /run/secrets becomes the setting it names
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      AZURE_DB_URL: jdbc:postgresql://db:5432/fairness
      AZURE_DB_USERNAME: fairness
      PYTHON_SCORER_URL: http://scorer:8000
      TEAM_TIMEZONE: *timezone
      # Served over plain HTTP: a Secure cookie would be dropped when opened by address instead of localhost
      REFRESH_COOKIE_SECURE: "false"
      # No PagerDuty in the demo: no scheduled sync, and "Sync now" fails quickly (recorded as a failed run)
      PAGERDUTY_SYNC_ENABLED: "false"
      PAGERDUTY_API_TOKEN: demo-not-a-token
      PAGERDUTY_BASE_URL: http://pagerduty.invalid
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-off: loads the demo data once the gateway has created the schema, then exits (seed.sh)
  seed:
    build: .
    image: fairness-demo/seed
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - *secrets-volume
    environment:
      PGHOST: db
      PGUSER: fairness
      PGDATABASE: fairness
    restart: "no"

  scorer:
    build: ${SCORER_CONTEXT:-https://github.com/biradarsrikanth/fairneess-scorer.git#main}
    image: fairness-demo/scorer
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - *secrets-volume
    environment:
      TEAM_TIMEZONE: *timezone
    # The scorer reads its settings from the environment only, so the generated values are exported first. The
    # rest is the scorer image's own command (its Dockerfile's CMD). The login is the read-only one from db-init.sh.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export SCORER_API_KEY="$$(cat /run/secrets/SCORER_API_KEY)"
        export AZURE_DB_URL="postgresql+psycopg://fairness_scorer:$$(cat /run/secrets/SCORER_DB_PASSWORD)@db:5432/fairness"
        exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --no-access-log \
          --proxy-headers --forwarded-allow-ips '*' --timeout-graceful-shutdown 20

  web:
    build: ${WEB_CONTEXT:-https://github.com/biradarsrikanth/fairness-web.git#main}
    image: fairness-demo/web
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  db-data:
  secrets:
