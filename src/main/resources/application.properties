
#App
spring.application.name=Fairness-Checker
server.port=${PORT:8080}

# Scorer (FastAPI). Timeouts are per attempt; failed connections and 502/503/504 are retried
scorer.base-url=${PYTHON_SCORER_URL:http://127.0.0.1:8000}
scorer.api-key=${SCORER_API_KEY}
scorer.connect-timeout=${SCORER_CONNECT_TIMEOUT:2s}
scorer.response-timeout=${SCORER_RESPONSE_TIMEOUT:10s}
scorer.max-retries=${SCORER_MAX_RETRIES:2}

# JPA / Hibernate: Flyway owns the schema (src/main/resources/db/migration), Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Existing databases were created by Hibernate: mark them as version 1 and apply newer migrations only
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Azure PostgreSQL
spring.datasource.url=${AZURE_DB_URL}
spring.datasource.username=${AZURE_DB_USERNAME}
spring.datasource.password=${AZURE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PagerDuty
pagerduty.base-url=${PAGERDUTY_BASE_URL:https://api.pagerduty.com}
pagerduty.integration-key=${PAGERDUTY_INTEGRATION_KEY:}
pagerduty.api-token=${PAGERDUTY_API_TOKEN}
pagerduty.webhook.secret=${PAGERDUTY_WEBHOOK_SECRET:}
pagerduty.connect-timeout=${PAGERDUTY_CONNECT_TIMEOUT:5s}
pagerduty.response-timeout=${PAGERDUTY_RESPONSE_TIMEOUT:30s}

# Scheduled sync: a safety net for missed webhooks, re-reading incidents created in the lookback window
pagerduty.sync.enabled=${PAGERDUTY_SYNC_ENABLED:true}
pagerduty.sync-rate=${PAGERDUTY_SYNC_RATE:3000000}
pagerduty.sync.lookback-days=${PAGERDUTY_SYNC_LOOKBACK_DAYS:30}
# On-call shifts: recent days each run; backfill longer periods with POST /api/pagerduty/sync/oncalls?days=365
pagerduty.sync.oncall-lookback-days=${PAGERDUTY_ONCALL_LOOKBACK_DAYS:7}

# Inserts demo engineers into an empty database (local development only)
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Actuator: health probes for the platform, Prometheus metrics for monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
