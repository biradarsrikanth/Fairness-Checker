
#App
spring.application.name=Fairness-Checker
server.port=${PORT:8080}
# Behind a reverse proxy (Azure, Nginx): take the client IP and scheme from X-Forwarded-* headers, trusting
# only proxies on private networks. Login rate limits are per client IP, so this must be right
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Scorer (FastAPI). Timeouts are per attempt; failed connections and 502/503/504 are retried
scorer.base-url=${PYTHON_SCORER_URL:http://127.0.0.1:8000}
scorer.api-key=${SCORER_API_KEY}
scorer.connect-timeout=${SCORER_CONNECT_TIMEOUT:2s}
scorer.response-timeout=${SCORER_RESPONSE_TIMEOUT:10s}
scorer.max-retries=${SCORER_MAX_RETRIES:2}

# Auth. Access tokens are JWTs signed with JWT_SECRET (HS256, at least 32 characters, e.g.
# `openssl rand -base64 48`); changing the secret signs everyone out
auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=${JWT_ISSUER:fairness-checker}
auth.jwt.audience=${JWT_AUDIENCE:fairness-web}
auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
# Refresh tokens are opaque and single-use: each refresh replaces the token and restarts its lifetime. A token
# replaced less than the grace period ago is accepted again (two tabs refreshing at once); later, it ends the
# session as a likely theft
auth.refresh-token.ttl=${REFRESH_TOKEN_TTL:7d}
auth.refresh-token.reuse-grace=${REFRESH_TOKEN_REUSE_GRACE:10s}
# Brute-force protection: lock an account after this many wrong passwords in a row, and limit sign-in attempts
# per client IP
auth.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-duration=${LOGIN_LOCK_DURATION:15m}
auth.login.attempts-per-ip-per-minute=${LOGIN_ATTEMPTS_PER_IP_PER_MINUTE:10}
# The refresh token cookie; keep REFRESH_COOKIE_SECURE=true unless serving over plain HTTP on a host other than
# localhost
auth.refresh-cookie.name=fairness_refresh
auth.refresh-cookie.path=/api/v1/auth
auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
auth.refresh-cookie.same-site=Strict
# First admin: created at startup while there are no users (password: at least 12 characters, changed at first
# sign-in). Ignored once any user exists; remove the password from the environment afterwards
auth.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
auth.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
auth.bootstrap-admin.full-name=${ADMIN_BOOTSTRAP_NAME:Administrator}

# Analytics dates are days in this timezone; keep it equal to the scorer's TEAM_TIMEZONE
analytics.timezone=${TEAM_TIMEZONE:Asia/Kolkata}

# JPA / Hibernate: Flyway owns the schema (src/main/resources/db/migration), Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Existing databases were created by Hibernate: mark them as version 1 and apply newer migrations only
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Azure PostgreSQL
spring.datasource.url=${AZURE_DB_URL}
spring.datasource.username=${AZURE_DB_USERNAME}
spring.datasource.password=${AZURE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PagerDuty
pagerduty.base-url=${PAGERDUTY_BASE_URL:https://api.pagerduty.com}
pagerduty.integration-key=${PAGERDUTY_INTEGRATION_KEY:}
# Optional: without it PagerDuty is off (no syncs; the PagerDuty endpoints answer 409 PAGERDUTY_NOT_CONFIGURED)
pagerduty.api-token=${PAGERDUTY_API_TOKEN:}
pagerduty.webhook.secret=${PAGERDUTY_WEBHOOK_SECRET:}
pagerduty.connect-timeout=${PAGERDUTY_CONNECT_TIMEOUT:5s}
pagerduty.response-timeout=${PAGERDUTY_RESPONSE_TIMEOUT:30s}

# Scheduled sync: a safety net for missed webhooks, re-reading incidents created in the lookback window
pagerduty.sync.enabled=${PAGERDUTY_SYNC_ENABLED:true}
pagerduty.sync-rate=${PAGERDUTY_SYNC_RATE:3000000}
pagerduty.sync.lookback-days=${PAGERDUTY_SYNC_LOOKBACK_DAYS:30}
# On-call shifts: recent days each run; backfill longer periods with POST /api/v1/pagerduty/sync/oncalls?days=365
pagerduty.sync.oncall-lookback-days=${PAGERDUTY_ONCALL_LOOKBACK_DAYS:7}
# Each kind of sync holds a lock (shedlock table) so instances never run it twice at once. A lock held by an
# instance that died expires after this; keep it well above the longest sync
pagerduty.sync.lock-at-most-for=${PAGERDUTY_SYNC_LOCK_AT_MOST_FOR:30m}

# Inserts demo engineers into an empty database (local development only)
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Actuator: health probes for the platform, Prometheus metrics for monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# API docs: OpenAPI spec at /v3/api-docs, Swagger UI at /swagger-ui.html
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Responses are JSON (errors are application/problem+json); without this the spec says */*, and generated
# clients read bodies as binary
springdoc.default-produces-media-type=application/json
# Keep the token entered under Authorize across page reloads (development convenience)
springdoc.swagger-ui.persist-authorization=true

# Lists: ?page=0&size=20&sort=field,desc. Pages are numbered from 0; larger sizes are capped at 100
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# PDF and Excel reports, built in memory per request. The window can't exceed the on-call listing's 366 days
report.max-window-days=${REPORT_MAX_WINDOW_DAYS:366}
report.max-alert-rows=${REPORT_MAX_ALERT_ROWS:5000}
report.max-shift-rows=${REPORT_MAX_SHIFT_ROWS:2000}
