# Tests are hermetic: never read the developer's .env (spring-dotenv binds its keys like environment
# variables, e.g. PAGERDUTY_WEBHOOK_SECRET would override pagerduty.webhook.secret below)
springdotenv.enabled=false

pagerduty.api-token=test-token
pagerduty.webhook.secret=test-secret
pagerduty.base-url=https://api.pagerduty.com
pagerduty.sync.enabled=false

scorer.base-url=http://127.0.0.1:1
scorer.api-key=test-api-key-0123456789abcdef0123456789

auth.jwt.secret=test-jwt-secret-0123456789abcdef0123456789

# Unit tests use H2 with a Hibernate-generated schema; SchemaContractTest checks the real
# Flyway migrations against PostgreSQL
# A database per test context: a closing context drops its schema, which mustn't affect another one
spring.datasource.url=jdbc:h2:mem:${random.uuid}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
pagerduty.sync.lookback-days=30
pagerduty.sync.oncall-lookback-days=7
