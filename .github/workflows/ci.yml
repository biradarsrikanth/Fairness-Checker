name: CI

# Runs on pull requests; merges to main are built and deployed by main_fairness-tracker.yml
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      # Includes SchemaContractTest, which runs the Flyway migrations on PostgreSQL via Testcontainers
      - name: Build and test
        run: mvn -B verify

      - name: Build image
        run: docker build -t fairness-checker:${{ github.sha }} .
